<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tetris</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#111;color:#eee;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center}
#wrap{display:flex;flex-direction:column;align-items:center;max-width:360px;width:100%;height:100%;max-height:750px;padding:8px;gap:6px}

#hdr{display:flex;justify-content:space-between;width:100%;flex-shrink:0}
#hdr h1{font-size:1.3rem;font-weight:800;letter-spacing:3px;color:#0ff}
.sb{text-align:center;min-width:48px}
.sb-l{font-size:.55rem;text-transform:uppercase;letter-spacing:1px;color:#666}
.sb-v{font-size:1rem;font-weight:700}

#main{display:flex;gap:10px;flex:1;width:100%;min-height:0;align-items:flex-start;justify-content:center}

#board-wrap{position:relative;background:#1a1a1a;border:2px solid #333;border-radius:4px;aspect-ratio:10/20;height:100%;max-height:100%}
#board{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(20,1fr);width:100%;height:100%;gap:1px;padding:1px}
.cell{border-radius:2px;background:#222}
.cell.filled{border:1px solid rgba(255,255,255,.15)}

#side{display:flex;flex-direction:column;gap:12px;flex-shrink:0;width:70px}
.side-label{font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:#666;margin-bottom:4px}
#next-box{background:#1a1a1a;border:1px solid #333;border-radius:4px;padding:4px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:1px;aspect-ratio:1}
#next-box .cell{background:#1a1a1a}

#controls{display:flex;gap:4px;width:100%;flex-shrink:0;justify-content:center;flex-wrap:wrap}
.cbtn{background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#888;font-size:1.2rem;padding:10px 14px;cursor:pointer;flex:1;max-width:60px;text-align:center;-webkit-tap-highlight-color:transparent}
.cbtn:active{background:#222;color:#0ff;border-color:#0ff}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:10px;padding:20px;text-align:center}
.ov.hidden{display:none}
.ov h2{font-size:1.8rem;color:#0ff}
.ov p{color:#888;font-size:.85rem}
.ov .big{font-size:2.2rem;font-weight:800;color:#fff}
.play{padding:12px 40px;border:none;border-radius:8px;background:#0ff;color:#111;font-size:1rem;font-weight:700;cursor:pointer;margin-top:4px}
.play:active{opacity:.8}

/* Piece colors */
.p-I{background:#00f0f0}.p-O{background:#f0f000}.p-T{background:#a000f0}
.p-S{background:#00f000}.p-Z{background:#f00000}.p-J{background:#0000f0}.p-L{background:#f0a000}
</style>
</head>
<body>
<div id="wrap">
  <div id="hdr">
    <div class="sb"><div class="sb-l">Score</div><div class="sb-v" id="sc">0</div></div>
    <h1>TETRIS</h1>
    <div style="display:flex;gap:8px">
      <div class="sb"><div class="sb-l">Level</div><div class="sb-v" id="lv">1</div></div>
      <div class="sb"><div class="sb-l">Lines</div><div class="sb-v" id="ln">0</div></div>
    </div>
  </div>
  <div id="main">
    <div id="board-wrap"><div id="board"></div></div>
    <div id="side">
      <div><div class="side-label">Next</div><div id="next-box"></div></div>
    </div>
  </div>
  <div id="controls">
    <div class="cbtn" id="bl">&#9664;</div>
    <div class="cbtn" id="bd">&#9660;</div>
    <div class="cbtn" id="br">&#9654;</div>
    <div class="cbtn" id="brot">&#8635;</div>
    <div class="cbtn" id="bdrp">&#9868;</div>
  </div>
</div>

<div class="ov" id="s-start">
  <h2>TETRIS</h2>
  <p>Arrow keys or tap buttons to play</p>
  <button class="play" id="b-start">Play</button>
</div>

<div class="ov hidden" id="s-over">
  <h2>Game Over</h2>
  <div class="big" id="o-sc">0</div>
  <p>Lines: <span id="o-ln">0</span> &middot; Level: <span id="o-lv">1</span></p>
  <button class="play" id="b-again">Play Again</button>
</div>

<div class="ov hidden" id="s-pause">
  <h2>Paused</h2>
  <button class="play" id="b-resume">Resume</button>
</div>

<script>
(function(){
'use strict';

const W=10,H=20;
const PIECES={
  I:{shape:[[0,0],[1,0],[2,0],[3,0]],color:'I'},
  O:{shape:[[0,0],[1,0],[0,1],[1,1]],color:'O'},
  T:{shape:[[0,0],[1,0],[2,0],[1,1]],color:'T'},
  S:{shape:[[1,0],[2,0],[0,1],[1,1]],color:'S'},
  Z:{shape:[[0,0],[1,0],[1,1],[2,1]],color:'Z'},
  J:{shape:[[0,0],[0,1],[1,1],[2,1]],color:'J'},
  L:{shape:[[2,0],[0,1],[1,1],[2,1]],color:'L'}
};
const NAMES=Object.keys(PIECES);
const SPEEDS=[800,720,630,550,470,380,300,220,140,100,80,60,50];

let board,piece,next,px,py,score,lines,level,timer,on,paused;

const $=id=>document.getElementById(id);
const boardEl=$('board'),nextEl=$('next-box');

function build(){
  boardEl.innerHTML='';nextEl.innerHTML='';
  for(let i=0;i<H*W;i++){const d=document.createElement('div');d.className='cell';boardEl.appendChild(d);}
  for(let i=0;i<16;i++){const d=document.createElement('div');d.className='cell';nextEl.appendChild(d);}
}

function clearBoard(){board=Array.from({length:H},()=>Array(W).fill(null));}

function cellAt(r,c){return boardEl.children[r*W+c];}

function render(){
  // Draw board
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const el=cellAt(r,c),v=board[r][c];
    el.className=v?`cell filled p-${v}`:'cell';
  }
  // Draw ghost
  if(piece){
    let gy=py;
    while(fits(piece.cells,px,gy+1))gy++;
    if(gy!==py)for(const[dx,dy]of piece.cells){
      const r=gy+dy,c=px+dx;
      if(r>=0&&r<H&&c>=0&&c<W){const el=cellAt(r,c);if(!board[r][c])el.style.opacity='.15',el.className=`cell filled p-${piece.color}`;}
    }
    // Draw piece
    for(const[dx,dy]of piece.cells){
      const r=py+dy,c=px+dx;
      if(r>=0&&r<H&&c>=0&&c<W)cellAt(r,c).className=`cell filled p-${piece.color}`;
    }
  }
  // Next
  for(let i=0;i<16;i++)nextEl.children[i].className='cell';
  if(next)for(const[dx,dy]of next.cells){
    const i=(dy+1)*4+(dx);
    if(i>=0&&i<16)nextEl.children[i].className=`cell filled p-${next.color}`;
  }
}

function makePiece(name){
  const p=PIECES[name];
  return{cells:p.shape.map(([x,y])=>[x,y]),color:p.color,name};
}

function randomPiece(){return makePiece(NAMES[Math.floor(Math.random()*NAMES.length)]);}

function fits(cells,ox,oy){
  for(const[dx,dy]of cells){
    const c=ox+dx,r=oy+dy;
    if(c<0||c>=W||r>=H)return false;
    if(r>=0&&board[r][c])return false;
  }
  return true;
}

function rotate(){
  if(!piece||piece.name==='O')return;
  // Rotate 90 CW around bounding box center
  const xs=piece.cells.map(c=>c[0]),ys=piece.cells.map(c=>c[1]);
  const mx=Math.max(...xs),my=Math.max(...ys);
  const newCells=piece.cells.map(([x,y])=>[my-y,x]);
  // Wall kicks: try 0, -1, +1, -2, +2
  for(const kick of[0,-1,1,-2,2]){
    if(fits(newCells,px+kick,py)){piece.cells=newCells;px+=kick;return;}
  }
}

function lock(){
  for(const[dx,dy]of piece.cells){
    const r=py+dy,c=px+dx;
    if(r<0){gameOver();return;}
    board[r][c]=piece.color;
  }
  clearLines();
  spawn();
}

function clearLines(){
  let cleared=0;
  for(let r=H-1;r>=0;r--){
    if(board[r].every(c=>c)){
      board.splice(r,1);
      board.unshift(Array(W).fill(null));
      cleared++;r++;
    }
  }
  if(cleared){
    const pts=[0,100,300,500,800];
    lines+=cleared;
    score+=pts[cleared]*level;
    level=Math.floor(lines/10)+1;
    $('sc').textContent=score;$('ln').textContent=lines;$('lv').textContent=level;
    resetTimer();
  }
}

function spawn(){
  piece=next||randomPiece();
  next=randomPiece();
  // Center piece
  const xs=piece.cells.map(c=>c[0]);
  px=Math.floor((W-Math.max(...xs)-1)/2);
  py=-Math.min(...piece.cells.map(c=>c[1]));
  if(!fits(piece.cells,px,py))gameOver();
}

function tick(){
  if(!on||paused)return;
  if(fits(piece.cells,px,py+1))py++;
  else lock();
  render();
}

function resetTimer(){clearInterval(timer);timer=setInterval(tick,SPEEDS[Math.min(level-1,SPEEDS.length-1)]);}

function hardDrop(){
  while(fits(piece.cells,px,py+1))py++;
  lock();render();
}

function startGame(){
  clearBoard();score=0;lines=0;level=1;on=true;paused=false;
  $('sc').textContent='0';$('ln').textContent='0';$('lv').textContent='1';
  next=null;spawn();render();resetTimer();
  $('s-start').classList.add('hidden');$('s-over').classList.add('hidden');
}

function gameOver(){
  on=false;clearInterval(timer);
  $('o-sc').textContent=score;$('o-ln').textContent=lines;$('o-lv').textContent=level;
  $('s-over').classList.remove('hidden');
}

function togglePause(){
  if(!on)return;
  paused=!paused;
  $('s-pause').classList.toggle('hidden',!paused);
  if(!paused)resetTimer();else clearInterval(timer);
}

// Input
function move(dir){if(on&&!paused&&fits(piece.cells,px+dir,py)){px+=dir;render();}}
function softDrop(){if(on&&!paused&&fits(piece.cells,px,py+1)){py++;score++;$('sc').textContent=score;render();}}
function doRotate(){if(on&&!paused){rotate();render();}}
function doHardDrop(){if(on&&!paused)hardDrop();}

document.addEventListener('keydown',e=>{
  if(!on&&e.key==='Enter'){startGame();return;}
  if(e.key==='Escape'||e.key==='p'){togglePause();return;}
  if(!on||paused)return;
  switch(e.key){
    case'ArrowLeft':move(-1);break;
    case'ArrowRight':move(1);break;
    case'ArrowDown':softDrop();break;
    case'ArrowUp':doRotate();break;
    case' ':doHardDrop();break;
  }
  e.preventDefault();
});

// Touch buttons
$('bl').addEventListener('click',()=>move(-1));
$('br').addEventListener('click',()=>move(1));
$('bd').addEventListener('click',softDrop);
$('brot').addEventListener('click',doRotate);
$('bdrp').addEventListener('click',doHardDrop);

// Touch swipe on board
let tx=null,ty=null;
const bw=$('board-wrap');
bw.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;});
bw.addEventListener('touchend',e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  tx=ty=null;
  if(Math.abs(dx)<10&&Math.abs(dy)<10){doRotate();return;}
  if(Math.abs(dx)>Math.abs(dy)){dx>0?move(1):move(-1);}
  else if(dy>30)doHardDrop();
});

$('b-start').addEventListener('click',startGame);
$('b-again').addEventListener('click',startGame);
$('b-resume').addEventListener('click',togglePause);

build();
})();
</script>
</body>
</html>
