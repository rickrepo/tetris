<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tetris</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden;position:fixed;width:100%}
body{
  height:100%;overflow:hidden;background:#111;color:#eee;
  font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;
  touch-action:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#wrap{
  display:flex;flex-direction:column;align-items:center;
  width:100%;height:100%;max-width:480px;
  padding:4px 4px 0;gap:0;
}

/* ── Top bar: score / next / level+lines ── */
#top{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;flex-shrink:0;padding:2px 4px 4px;
}
.sb{text-align:center;min-width:40px}
.sb-l{font-size:.5rem;text-transform:uppercase;letter-spacing:1px;color:#555}
.sb-v{font-size:.9rem;font-weight:700}

#next-wrap{display:flex;align-items:center;gap:6px}
#next-label{font-size:.5rem;text-transform:uppercase;letter-spacing:1px;color:#555}
#next-box{
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);
  gap:1px;width:52px;height:26px;
}
#next-box .nc{border-radius:2px;background:#1a1a1a}
#next-box .nc.filled{border:1px solid rgba(255,255,255,.12)}

/* ── Board ── */
#board-area{flex:1;width:100%;display:flex;justify-content:center;min-height:0;padding:0 2px}
#board-wrap{
  position:relative;background:#0a0a0a;
  border:2px solid #333;border-radius:4px;
  aspect-ratio:10/20;height:100%;max-height:100%;
}
#board{
  display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(20,1fr);
  width:100%;height:100%;gap:1px;padding:1px;
}
.cell{border-radius:2px;background:#181818}
.cell.filled{border:1px solid rgba(255,255,255,.15)}
.cell.ghost{opacity:.18}

/* ── Controls ── */
#controls{
  display:flex;width:100%;flex-shrink:0;
  padding:6px 2px;padding-bottom:max(6px, env(safe-area-inset-bottom));
  gap:8px;justify-content:space-between;align-items:center;
}

/* Left side: d-pad (left / down / right) */
#dpad{display:flex;gap:4px;align-items:center}
.cbtn{
  background:#1a1a1a;border:2px solid #2a2a2a;border-radius:14px;
  color:#777;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;flex-shrink:0;
  transition:background .05s,border-color .05s;
}
.cbtn.active{background:#222;color:#0ff;border-color:#0ff}
.cbtn.arrow{width:52px;height:52px;font-size:1.3rem}
.cbtn.down{width:44px;height:52px;font-size:1.1rem}

/* Right side: rotate + hard drop */
#actions{display:flex;gap:6px;align-items:center}
.cbtn.act{width:58px;height:58px;font-size:1.5rem;border-radius:50%}
.cbtn.drop-btn{background:#1a1a2a;border-color:#334}

/* Center: pause */
#pause-btn{
  width:36px;height:36px;border-radius:50%;
  font-size:.7rem;background:#1a1a1a;border:1px solid #2a2a2a;
  color:#555;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;flex-shrink:0;
}
#pause-btn.active{border-color:#0ff;color:#0ff}

/* ── Overlays ── */
.ov{
  position:fixed;inset:0;background:rgba(0,0,0,.88);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:50;gap:10px;padding:24px;text-align:center;
}
.ov.hidden{display:none}
.ov h2{font-size:1.8rem;color:#0ff}
.ov p{color:#888;font-size:.85rem}
.ov .big{font-size:2.4rem;font-weight:800;color:#fff}
.play{
  padding:14px 48px;border:none;border-radius:12px;
  background:#0ff;color:#111;font-size:1.05rem;font-weight:700;
  cursor:pointer;margin-top:4px;
  -webkit-tap-highlight-color:transparent;
}
.play:active{opacity:.8}

/* ── Piece colors ── */
.p-I{background:#00e5e5}.p-O{background:#e5e500}.p-T{background:#b040e0}
.p-S{background:#00e000}.p-Z{background:#e02020}.p-J{background:#3030e0}.p-L{background:#e09020}
</style>
</head>
<body>

<div id="wrap">
  <div id="top">
    <div class="sb"><div class="sb-l">Score</div><div class="sb-v" id="sc">0</div></div>
    <div id="next-wrap">
      <span id="next-label">Next</span>
      <div id="next-box"></div>
    </div>
    <div style="display:flex;gap:6px">
      <div class="sb"><div class="sb-l">Level</div><div class="sb-v" id="lv">1</div></div>
      <div class="sb"><div class="sb-l">Lines</div><div class="sb-v" id="ln">0</div></div>
    </div>
  </div>

  <div id="board-area">
    <div id="board-wrap"><div id="board"></div></div>
  </div>

  <div id="controls">
    <div id="dpad">
      <div class="cbtn arrow" id="bl">&#9664;</div>
      <div class="cbtn down" id="bd">&#9660;</div>
      <div class="cbtn arrow" id="br">&#9654;</div>
    </div>
    <div id="pause-btn" id="bp">&#9646;&#9646;</div>
    <div id="actions">
      <div class="cbtn act drop-btn" id="bdrp">&#9660;&#9660;</div>
      <div class="cbtn act" id="brot">&#8635;</div>
    </div>
  </div>
</div>

<!-- Start -->
<div class="ov" id="s-start">
  <h2>TETRIS</h2>
  <button class="play" id="b-start">Play</button>
</div>

<!-- Game Over -->
<div class="ov hidden" id="s-over">
  <h2>Game Over</h2>
  <div class="big" id="o-sc">0</div>
  <p>Lines: <span id="o-ln">0</span> &middot; Level: <span id="o-lv">1</span></p>
  <button class="play" id="b-again">Play Again</button>
</div>

<!-- Pause -->
<div class="ov hidden" id="s-pause">
  <h2>Paused</h2>
  <button class="play" id="b-resume">Resume</button>
</div>

<script>
(function(){
'use strict';

const W=10, H=20;
const PIECES={
  I:{shape:[[0,0],[1,0],[2,0],[3,0]],color:'I'},
  O:{shape:[[0,0],[1,0],[0,1],[1,1]],color:'O'},
  T:{shape:[[0,0],[1,0],[2,0],[1,1]],color:'T'},
  S:{shape:[[1,0],[2,0],[0,1],[1,1]],color:'S'},
  Z:{shape:[[0,0],[1,0],[1,1],[2,1]],color:'Z'},
  J:{shape:[[0,0],[0,1],[1,1],[2,1]],color:'J'},
  L:{shape:[[2,0],[0,1],[1,1],[2,1]],color:'L'}
};
const NAMES=Object.keys(PIECES);
const SPEEDS=[800,720,630,550,470,380,300,220,140,100,80,60,50];

let board,piece,next,px,py,score,lines,level,timer,on,paused;

const $=id=>document.getElementById(id);
const boardEl=$('board'), nextEl=$('next-box');

// ── Build DOM ──
function build(){
  boardEl.innerHTML='';
  for(let i=0;i<H*W;i++){const d=document.createElement('div');d.className='cell';boardEl.appendChild(d);}
  nextEl.innerHTML='';
  for(let i=0;i<8;i++){const d=document.createElement('div');d.className='nc';nextEl.appendChild(d);}
}

function clearBoard(){board=Array.from({length:H},()=>Array(W).fill(null));}
function cellAt(r,c){return boardEl.children[r*W+c];}

// ── Render ──
function render(){
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const el=cellAt(r,c),v=board[r][c];
    el.className=v?'cell filled p-'+v:'cell';
    el.style.opacity='';
  }
  if(piece){
    // Ghost
    let gy=py;
    while(fits(piece.cells,px,gy+1))gy++;
    if(gy!==py)for(const[dx,dy]of piece.cells){
      const r=gy+dy,c=px+dx;
      if(r>=0&&r<H&&c>=0&&c<W&&!board[r][c]){
        const el=cellAt(r,c);
        el.className='cell filled ghost p-'+piece.color;
      }
    }
    // Active piece
    for(const[dx,dy]of piece.cells){
      const r=py+dy,c=px+dx;
      if(r>=0&&r<H&&c>=0&&c<W){
        const el=cellAt(r,c);
        el.className='cell filled p-'+piece.color;
        el.style.opacity='';
      }
    }
  }
  // Next preview — 4x2 grid
  for(let i=0;i<8;i++)nextEl.children[i].className='nc';
  if(next){
    // Offset to center in the 4x2 box
    const minY=Math.min(...next.cells.map(c=>c[1]));
    for(const[dx,dy]of next.cells){
      const i=(dy-minY)*4+dx;
      if(i>=0&&i<8)nextEl.children[i].className='nc filled p-'+next.color;
    }
  }
}

// ── Piece logic ──
function makePiece(name){
  const p=PIECES[name];
  return{cells:p.shape.map(([x,y])=>[x,y]),color:p.color,name};
}

// 7-bag randomizer
let bag=[];
function nextFromBag(){
  if(!bag.length){bag=[...NAMES];for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}}
  return makePiece(bag.pop());
}

function fits(cells,ox,oy){
  for(const[dx,dy]of cells){
    const c=ox+dx,r=oy+dy;
    if(c<0||c>=W||r>=H)return false;
    if(r>=0&&board[r][c])return false;
  }
  return true;
}

function rotate(){
  if(!piece||piece.name==='O')return;
  const ys=piece.cells.map(c=>c[1]);
  const my=Math.max(...ys);
  const nc=piece.cells.map(([x,y])=>[my-y,x]);
  for(const kick of[0,-1,1,-2,2]){
    if(fits(nc,px+kick,py)){piece.cells=nc;px+=kick;return;}
  }
}

function lock(){
  for(const[dx,dy]of piece.cells){
    const r=py+dy,c=px+dx;
    if(r<0){gameOver();return;}
    board[r][c]=piece.color;
  }
  doClearLines();
  spawn();
}

function doClearLines(){
  let cleared=0;
  for(let r=H-1;r>=0;r--){
    if(board[r].every(c=>c)){
      board.splice(r,1);
      board.unshift(Array(W).fill(null));
      cleared++;r++;
    }
  }
  if(cleared){
    lines+=cleared;
    score+=[0,100,300,500,800][cleared]*level;
    level=Math.floor(lines/10)+1;
    $('sc').textContent=score;$('ln').textContent=lines;$('lv').textContent=level;
    resetTimer();
  }
}

function spawn(){
  piece=next||nextFromBag();
  next=nextFromBag();
  const xs=piece.cells.map(c=>c[0]);
  px=Math.floor((W-Math.max(...xs)-1)/2);
  py=-Math.min(...piece.cells.map(c=>c[1]));
  if(!fits(piece.cells,px,py))gameOver();
}

function tick(){
  if(!on||paused)return;
  if(fits(piece.cells,px,py+1))py++;
  else lock();
  render();
}

function resetTimer(){clearInterval(timer);timer=setInterval(tick,SPEEDS[Math.min(level-1,SPEEDS.length-1)]);}

// ── Actions ──
function moveLeft(){if(on&&!paused&&fits(piece.cells,px-1,py)){px--;render();}}
function moveRight(){if(on&&!paused&&fits(piece.cells,px+1,py)){px++;render();}}
function softDrop(){if(on&&!paused&&fits(piece.cells,px,py+1)){py++;score++;$('sc').textContent=score;render();}}
function hardDrop(){if(!on||paused)return;while(fits(piece.cells,px,py+1)){py++;score+=2;}$('sc').textContent=score;lock();render();}
function doRotate(){if(on&&!paused){rotate();render();}}

function startGame(){
  clearBoard();score=0;lines=0;level=1;on=true;paused=false;bag=[];
  $('sc').textContent='0';$('ln').textContent='0';$('lv').textContent='1';
  next=null;spawn();render();resetTimer();
  $('s-start').classList.add('hidden');$('s-over').classList.add('hidden');$('s-pause').classList.add('hidden');
}

function gameOver(){
  on=false;clearInterval(timer);
  $('o-sc').textContent=score;$('o-ln').textContent=lines;$('o-lv').textContent=level;
  $('s-over').classList.remove('hidden');
}

function togglePause(){
  if(!on)return;paused=!paused;
  $('s-pause').classList.toggle('hidden',!paused);
  if(!paused)resetTimer();else clearInterval(timer);
}

// ── Keyboard (desktop fallback) ──
document.addEventListener('keydown',e=>{
  if(!on&&e.key==='Enter'){startGame();return;}
  if(e.key==='Escape'||e.key==='p'){togglePause();return;}
  if(!on||paused)return;
  switch(e.key){
    case'ArrowLeft':moveLeft();break;case'ArrowRight':moveRight();break;
    case'ArrowDown':softDrop();break;case'ArrowUp':doRotate();break;
    case' ':hardDrop();break;
  }
  e.preventDefault();
});

// ── Touch: hold-to-repeat for d-pad buttons ──
const DAS_DELAY=170, DAS_RATE=50;

function attachHold(el, action){
  let holdTimer=null, repTimer=null, active=false;

  function start(e){
    e.preventDefault();
    if(active)return;active=true;
    el.classList.add('active');
    action();
    holdTimer=setTimeout(()=>{repTimer=setInterval(action,DAS_RATE);},DAS_DELAY);
  }
  function stop(e){
    if(e)e.preventDefault();
    if(!active)return;active=false;
    el.classList.remove('active');
    clearTimeout(holdTimer);clearInterval(repTimer);
    holdTimer=repTimer=null;
  }

  el.addEventListener('touchstart',start,{passive:false});
  el.addEventListener('touchend',stop,{passive:false});
  el.addEventListener('touchcancel',stop,{passive:false});
  // Mouse fallback
  el.addEventListener('mousedown',start);
  el.addEventListener('mouseup',stop);
  el.addEventListener('mouseleave',stop);
}

attachHold($('bl'),moveLeft);
attachHold($('br'),moveRight);
attachHold($('bd'),softDrop);

// Single-tap buttons (no repeat)
function attachTap(el, action){
  el.addEventListener('touchstart',e=>{e.preventDefault();el.classList.add('active');action();},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();el.classList.remove('active');},{passive:false});
  el.addEventListener('touchcancel',()=>el.classList.remove('active'));
  el.addEventListener('mousedown',()=>{el.classList.add('active');action();});
  el.addEventListener('mouseup',()=>el.classList.remove('active'));
  el.addEventListener('mouseleave',()=>el.classList.remove('active'));
}

attachTap($('brot'),doRotate);
attachTap($('bdrp'),hardDrop);

$('pause-btn').addEventListener('touchstart',e=>{e.preventDefault();togglePause();},{passive:false});
$('pause-btn').addEventListener('click',togglePause);

// ── Swipe on board for quick gestures ──
let tx=null,ty=null,ttime=0;
const bw=$('board-wrap');
bw.addEventListener('touchstart',e=>{
  e.preventDefault();
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;ttime=Date.now();
},{passive:false});
bw.addEventListener('touchend',e=>{
  e.preventDefault();
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  const dt=Date.now()-ttime;
  tx=ty=null;
  // Quick tap = rotate
  if(Math.abs(dx)<15&&Math.abs(dy)<15&&dt<300){doRotate();return;}
  // Swipe down = hard drop
  if(dy>40&&Math.abs(dy)>Math.abs(dx)*1.5){hardDrop();return;}
  // Horizontal swipe = move (one cell per swipe)
  if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy)){dx>0?moveRight():moveLeft();}
},{passive:false});

// Prevent all default touch on the game to avoid scroll/zoom
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// ── Overlay buttons ──
$('b-start').addEventListener('click',startGame);
$('b-again').addEventListener('click',startGame);
$('b-resume').addEventListener('click',togglePause);

// ── Init ──
build();
})();
</script>
</body>
</html>
